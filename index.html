<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11100e">
  <title>Perfect Match♥</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11100e;
      --panel: #191815;
      --panel-soft: #201e19;
      --gold: #d7b56d;
      --gold-bright: #f0d99e;
      --muted: #9c988e;
      --line: rgba(215, 181, 109, .2);
      --white: #f8f5ee;
      --danger: #df7670;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; background: #090908; }
    body { color: var(--white); }
    button, input { font: inherit; }
    button { color: inherit; }

    .device {
      width: min(100%, 414px);
      min-height: 100svh;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% -12%, rgba(172, 135, 62, .15), transparent 43%),
        var(--bg);
      box-shadow: 0 0 70px rgba(0, 0, 0, .72);
    }

    @media (min-width: 500px) {
      body { padding: 22px 0; }
      .device {
        min-height: min(852px, calc(100svh - 44px));
        height: min(852px, calc(100svh - 44px));
        border: 1px solid rgba(215, 181, 109, .14);
        border-radius: 34px;
      }
    }

    .screen {
      min-height: 100svh;
      padding: max(24px, env(safe-area-inset-top)) 25px max(26px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      animation: appear .32s ease both;
    }

    @media (min-width: 500px) {
      .screen { min-height: 100%; }
    }

    @keyframes appear {
      from { opacity: .25; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .wordmark {
      margin: 0;
      color: var(--gold-bright);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
      font-weight: 500;
      letter-spacing: -.7px;
    }

    .wordmark span { color: var(--white); }
    .eyebrow {
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.1px;
      text-transform: uppercase;
    }

    .landing {
      justify-content: space-between;
      padding-top: max(34px, env(safe-area-inset-top));
      padding-bottom: max(34px, env(safe-area-inset-bottom));
      background:
        linear-gradient(180deg, rgba(17, 16, 14, .08) 0%, rgba(17, 16, 14, .12) 42%, #11100e 87%),
        radial-gradient(ellipse at 53% 37%, rgba(181, 145, 76, .16), transparent 45%);
    }

    .brand-lockup { text-align: center; }
    .brand-lockup .wordmark { font-size: 30px; }
    .brand-lockup .eyebrow { display: block; margin-top: 10px; }

    .hero {
      text-align: center;
      margin: auto 0;
      padding: 60px 0 45px;
    }

    .seal {
      width: 92px;
      height: 92px;
      margin: 0 auto 30px;
      border: 1px solid rgba(215, 181, 109, .54);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--gold-bright);
      box-shadow: 0 0 35px rgba(215, 181, 109, .09), inset 0 0 24px rgba(215, 181, 109, .07);
      font-family: Georgia, serif;
      font-size: 36px;
    }

    .hero h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(32px, 9vw, 43px);
      font-weight: 400;
      letter-spacing: -1.25px;
      line-height: 1.13;
    }

    .hero h2 em { color: var(--gold-bright); font-weight: 400; }
    .hero-copy {
      max-width: 315px;
      margin: 19px auto 0;
      color: #b7b2a7;
      font-size: 13px;
      line-height: 1.9;
      word-break: keep-all;
    }

    .privacy-note {
      margin: 0 auto 22px;
      max-width: 330px;
      padding: 14px 15px;
      border: 1px solid rgba(215, 181, 109, .17);
      border-radius: 12px;
      background: rgba(255, 255, 255, .025);
      color: #938e83;
      font-size: 10px;
      line-height: 1.75;
      text-align: center;
      word-break: keep-all;
    }

    .privacy-note strong { color: var(--gold); font-weight: 600; }
    .primary-button {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(105deg, #d8b66e, #f0d99e 55%, #c7a35b);
      color: #17140d;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .25px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(194, 157, 83, .18);
      transition: transform .18s, filter .18s;
    }

    .primary-button:active, .round-action:active, .tab:active { transform: scale(.97); }
    .primary-button:hover { filter: brightness(1.06); }
    .subtle-footer { margin: 17px 0 0; color: #68655d; font-size: 10px; text-align: center; }

    .profile-screen { gap: 0; }
    .screen-heading { margin: 36px 0 26px; }
    .screen-heading h2 {
      margin: 9px 0 0;
      font-family: Georgia, serif;
      font-size: 30px;
      font-weight: 400;
      letter-spacing: -.6px;
    }
    .screen-heading p { margin: 9px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .form-field { margin-bottom: 19px; }
    .form-field label, .field-label {
      display: block;
      margin-bottom: 9px;
      color: #d9d4c9;
      font-size: 12px;
      font-weight: 650;
    }
    .text-input {
      width: 100%;
      height: 51px;
      padding: 0 14px;
      outline: none;
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 10px;
      background: #191815;
      color: var(--white);
      font-size: 14px;
      transition: border-color .2s, box-shadow .2s;
    }
    .text-input:focus { border-color: rgba(215, 181, 109, .65); box-shadow: 0 0 0 3px rgba(215, 181, 109, .08); }
    .text-input::placeholder { color: #625f57; }
    .profile-photo-row { display: flex; align-items: center; gap: 16px; margin: 4px 0 24px; }
    .user-avatar {
      width: 78px; height: 78px; flex: 0 0 78px; overflow: hidden;
      display: grid; place-items: center; border-radius: 50%;
      border: 1px solid rgba(215, 181, 109, .4);
      background: radial-gradient(circle at 35% 25%, #554533, #28241d 68%);
      color: var(--gold-bright); font-size: 29px;
    }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .photo-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .secondary-button, .avatar-choice {
      border: 1px solid rgba(215, 181, 109, .28);
      border-radius: 9px;
      background: rgba(215, 181, 109, .06);
      color: #ded6c5;
      cursor: pointer;
    }
    .secondary-button { min-height: 36px; padding: 0 12px; font-size: 11px; }
    .avatar-options { display: flex; gap: 5px; margin-top: 10px; }
    .avatar-choice { width: 31px; height: 31px; padding: 0; border-radius: 50%; font-size: 16px; }
    .avatar-choice[aria-pressed="true"] { border-color: var(--gold-bright); background: rgba(215, 181, 109, .19); }
    .form-spacer { flex: 1; min-height: 22px; }
    .local-only { margin: 12px 0 0; color: #777267; font-size: 10px; text-align: center; }

    .loading-screen { align-items: center; justify-content: center; text-align: center; }
    .spinner {
      width: 72px; height: 72px; margin-bottom: 30px; border-radius: 50%;
      border: 1px solid rgba(215, 181, 109, .19);
      border-top-color: var(--gold-bright);
      border-right-color: var(--gold);
      animation: spin 1.1s linear infinite;
      box-shadow: 0 0 32px rgba(215, 181, 109, .1);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-screen h2 { margin: 0 0 10px; font-family: Georgia, serif; font-size: 25px; font-weight: 400; }
    .loading-screen p { margin: 0; color: var(--muted); font-size: 13px; }
    .loading-dots { margin-top: 25px; color: var(--gold); letter-spacing: 5px; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .3; } }

    .app-screen { padding: max(18px, env(safe-area-inset-top)) 20px max(8px, env(safe-area-inset-bottom)); }
    .app-header { display: flex; align-items: center; justify-content: space-between; padding: 3px 2px 17px; }
    .app-header .wordmark { font-size: 23px; }
    .header-tag { color: var(--gold); font-size: 9px; letter-spacing: 1.5px; }
    .notification {
      position: absolute; z-index: 10; top: max(11px, env(safe-area-inset-top)); left: 13px; right: 13px;
      display: flex; align-items: center; gap: 11px; padding: 13px 14px;
      border: 1px solid rgba(240, 217, 158, .65); border-radius: 12px;
      background: rgba(35, 31, 23, .97); box-shadow: 0 10px 34px rgba(0, 0, 0, .45);
      animation: notice-in .35s ease both;
    }
    @keyframes notice-in { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
    .notification-icon { color: var(--gold-bright); font-size: 21px; }
    .notification-text { font-size: 12px; line-height: 1.5; }
    .notification-text strong { color: var(--gold-bright); }
    .notice-close { margin-left: auto; border: 0; background: transparent; color: #aaa396; font-size: 18px; cursor: pointer; }

    .swipe-screen { padding-bottom: 0; }
    .discovery-heading { display: flex; align-items: end; justify-content: space-between; margin: 2px 1px 14px; }
    .discovery-heading h2 { margin: 0; font-family: Georgia, serif; font-size: 24px; font-weight: 400; }
    .discovery-heading p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .count-label { color: #b3a885; font-size: 11px; }
    .card-stage { position: relative; width: 100%; flex: 1; min-height: 390px; max-height: 565px; }
    .profile-card {
      position: absolute; inset: 0; overflow: hidden; border: 1px solid rgba(215, 181, 109, .28);
      border-radius: 20px; background: #25221c; box-shadow: 0 15px 36px rgba(0, 0, 0, .36);
      touch-action: pan-y; user-select: none; will-change: transform;
    }
    .profile-card::after {
      content: ""; position: absolute; inset: 25% 0 0;
      background: linear-gradient(180deg, transparent, rgba(9, 8, 7, .25) 22%, rgba(9, 8, 7, .96) 100%);
      pointer-events: none;
    }
    .profile-card img { width: 100%; height: 100%; object-fit: cover; object-position: center 35%; }
    .card-placeholder {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 32%, #75634a, #29251e 62%, #171512);
      color: rgba(240, 217, 158, .8); font-family: Georgia, serif; font-size: 115px;
    }
    .card-topline { position: absolute; z-index: 1; top: 14px; left: 14px; display: flex; gap: 6px; }
    .vip-pill, .verified-pill { padding: 7px 9px; border-radius: 20px; font-size: 9px; letter-spacing: .8px; backdrop-filter: blur(12px); }
    .vip-pill { background: rgba(16, 15, 13, .72); color: var(--gold-bright); }
    .verified-pill { border: 1px solid rgba(240, 217, 158, .4); background: rgba(16, 15, 13, .62); color: #f0e8d4; }
    .swipe-stamp {
      position: absolute; z-index: 2; top: 38px; padding: 6px 13px; border: 3px solid; border-radius: 7px;
      font-size: 24px; font-weight: 850; letter-spacing: 2px; opacity: 0; pointer-events: none;
    }
    .stamp-like { left: 21px; color: #7ad0aa; border-color: #7ad0aa; transform: rotate(-13deg); }
    .stamp-pass { right: 21px; color: #e4887e; border-color: #e4887e; transform: rotate(13deg); }
    .card-details { position: absolute; z-index: 1; left: 21px; right: 21px; bottom: 22px; }
    .profile-name { margin: 0; font-family: Georgia, serif; font-size: 31px; font-weight: 400; letter-spacing: -.5px; }
    .profile-name span { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 24px; }
    .profile-job { margin: 6px 0 0; color: #ded8ca; font-size: 12px; }
    .card-divider { height: 1px; margin: 16px 0 12px; background: rgba(240, 217, 158, .24); }
    .greeting { margin: 0; color: #e5dfd2; font-size: 13px; line-height: 1.65; }
    .card-actions { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 16px 0 13px; }
    .round-action {
      display: grid; place-items: center; width: 57px; height: 57px; border-radius: 50%;
      background: #1c1a16; cursor: pointer; transition: transform .18s, background .18s;
    }
    .round-action.pass { border: 1px solid rgba(223, 118, 112, .5); color: #e28b84; font-size: 26px; }
    .round-action.like { width: 65px; height: 65px; border: 1px solid rgba(215, 181, 109, .65); background: linear-gradient(145deg, #d9b96f, #b88e43); color: #17140d; font-size: 26px; box-shadow: 0 6px 20px rgba(215, 181, 109, .2); }
    .round-action:hover { transform: translateY(-2px); }
    .action-hint { margin: -3px 0 11px; color: #777267; font-size: 10px; text-align: center; }
    .tab-bar {
      display: flex; justify-content: space-around; margin: 0 -20px;
      padding: 10px 20px max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid rgba(255, 255, 255, .07); background: rgba(17, 16, 14, .96);
    }
    .tab { min-width: 86px; display: grid; justify-items: center; gap: 3px; border: 0; background: transparent; color: #77746c; font-size: 9px; cursor: pointer; }
    .tab-icon { font-size: 19px; line-height: 1; }
    .tab[aria-current="page"] { color: var(--gold-bright); }

    .empty-state { flex: 1; display: grid; place-items: center; text-align: center; }
    .empty-state .seal { width: 76px; height: 76px; margin-bottom: 20px; font-size: 29px; }
    .empty-state h2 { margin: 0; font-family: Georgia, serif; font-size: 25px; font-weight: 400; }
    .empty-state p { max-width: 270px; margin: 9px auto 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .message-screen { padding-bottom: 0; }
    .message-heading { margin: 7px 0 22px; }
    .message-heading h2 { margin: 0; font-family: Georgia, serif; font-size: 30px; font-weight: 400; }
    .message-heading p { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
    .match-list { flex: 1; }
    .match-row {
      width: 100%; display: flex; align-items: center; gap: 13px; padding: 14px 0;
      border: 0; border-bottom: 1px solid rgba(255, 255, 255, .07); background: transparent; text-align: left; cursor: pointer;
    }
    .match-avatar { width: 56px; height: 56px; flex: 0 0 56px; overflow: hidden; display: grid; place-items: center; border: 1px solid rgba(215, 181, 109, .38); border-radius: 50%; background: #29251e; color: var(--gold-bright); font-size: 24px; }
    .match-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .match-copy { flex: 1; min-width: 0; }
    .match-copy strong { display: block; font-family: Georgia, serif; font-size: 17px; font-weight: 400; }
    .match-copy span { display: block; overflow: hidden; margin-top: 5px; color: #999489; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .match-meta { align-self: flex-start; color: #837d70; font-size: 9px; }
    .new-dot { display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; background: var(--gold); }

    .chat-screen { padding-bottom: 0; }
    .chat-header { display: flex; align-items: center; gap: 12px; padding: 4px 0 14px; border-bottom: 1px solid rgba(255, 255, 255, .07); }
    .back-button { width: 34px; height: 36px; border: 0; background: transparent; color: var(--gold-bright); font-size: 25px; cursor: pointer; }
    .chat-person { display: flex; align-items: center; gap: 10px; flex: 1; }
    .chat-person .match-avatar { width: 39px; height: 39px; flex-basis: 39px; font-size: 18px; }
    .chat-person strong { display: block; font-family: Georgia, serif; font-size: 16px; font-weight: 400; }
    .chat-person span { color: #8e897f; font-size: 9px; }
    .chat-body { flex: 1; display: flex; flex-direction: column; padding: 22px 0; }
    .chat-date { align-self: center; margin: 6px 0 22px; color: #6f6b61; font-size: 9px; letter-spacing: 1px; }
    .bubble-row { display: flex; align-items: end; gap: 8px; }
    .bubble-row .match-avatar { width: 29px; height: 29px; flex-basis: 29px; font-size: 14px; }
    .bubble { max-width: 75%; padding: 12px 15px; border: 1px solid rgba(215, 181, 109, .18); border-radius: 4px 15px 15px 15px; background: #211f1a; color: #f1ece2; font-size: 13px; }
    .chat-composer { display: flex; gap: 9px; padding: 11px 0 max(12px, env(safe-area-inset-bottom)); border-top: 1px solid rgba(255, 255, 255, .07); }
    .chat-composer input { flex: 1; min-width: 0; height: 43px; padding: 0 13px; border: 1px solid rgba(255, 255, 255, .1); border-radius: 22px; outline: 0; background: #1c1a16; color: var(--white); font-size: 12px; }
    .chat-composer input:focus { border-color: rgba(215, 181, 109, .5); }
    .chat-composer input::placeholder { color: #757066; }
    .send-button { width: 43px; height: 43px; border: 0; border-radius: 50%; background: var(--gold); color: #17140d; font-size: 16px; cursor: pointer; }
    .sent-bubble { align-self: flex-end; margin-top: 12px; border: 0; border-radius: 15px 4px 15px 15px; background: #a98542; color: #17140d; }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    @media (max-height: 720px) {
      .screen-heading { margin-top: 22px; margin-bottom: 17px; }
      .form-field { margin-bottom: 13px; }
      .card-stage { min-height: 320px; }
      .hero { padding: 38px 0 30px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }

    async function fetchSupabaseWithDiagnostics(input, init = {}) {
      const requestUrl = input instanceof Request ? input.url : String(input);
      const method = (init.method || (input instanceof Request ? input.method : "GET")).toUpperCase();
      const canRetry = method === "GET" || method === "HEAD";
      const maxAttempts = canRetry ? 3 : 1;

      for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
        try {
          return await window.fetch(input, init);
        } catch (error) {
          const message = supabaseErrorMessage(error);
          const diagnostic = {
            message,
            name: error instanceof Error ? error.name : typeof error,
            method,
            requestUrl,
            pageOrigin: window.location.origin,
            attempt,
            maxAttempts,
            likelyCauses: [
              "네트워크/DNS 연결 또는 광고 차단 확장 프로그램",
              "Supabase 프로젝트 URL 또는 프로젝트 상태",
              "Supabase API의 CORS 허용 Origin 설정"
            ]
          };
          console.error("[VIP Lounge] Supabase 네트워크 요청 실패:", diagnostic, error);

          if (attempt < maxAttempts && error instanceof TypeError) {
            await new Promise(resolve => window.setTimeout(resolve, attempt * 500));
            continue;
          }

          if (error instanceof TypeError && message.toLowerCase().includes("load failed")) {
            throw new TypeError(
              `${message}. 요청 주소: ${requestUrl}. ` +
              `페이지 Origin: ${window.location.origin}. ` +
              "네트워크와 Supabase CORS 허용 Origin을 확인해 주세요."
            );
          }
          throw error;
        }
      }

      throw new Error("Supabase 네트워크 요청을 완료하지 못했습니다.");
    }

    function supabaseErrorMessage(error) {
      if (error instanceof Error && error.message) return error.message;
      if (typeof error === "string") return error;
      if (error && typeof error === "object") {
        const knownFields = ["message", "details", "hint", "code"]
          .filter(key => typeof error[key] === "string" && error[key].trim())
          .map(key => `${key}: ${error[key].trim()}`);
        if (knownFields.length) return knownFields.join("\n");
        try {
          const serialized = JSON.stringify(error);
          if (serialized && serialized !== "{}") return serialized;
        } catch (serializationError) {
          console.error("[VIP Lounge] 오류 객체 직렬화 실패:", serializationError);
        }
        return Object.prototype.toString.call(error);
      }
      return String(error);
    }

    async function refreshLoungeComments() {
      const requestId = ++state.loungeCommentsRequestId;
      const { data: records, error } = await getSupabaseClient()
        .from("lounge_comments")
        .select("id, post_id, nickname, content, status, created_at")
        .order("created_at", { ascending: true });
      if (error) throw error;
      if (!Array.isArray(records)) {
        throw new Error("댓글 목록 응답 형식이 올바르지 않습니다.");
      }
      const commentsByPost = new Map();
      for (const record of records) {
        if (
          !Number.isInteger(record.id) ||
          !Number.isInteger(record.post_id) ||
          typeof record.nickname !== "string" ||
          typeof record.content !== "string" ||
          typeof record.status !== "string" ||
          typeof record.created_at !== "string" ||
          Number.isNaN(Date.parse(record.created_at))
        ) {
          throw new Error(
            "Supabase 댓글 데이터의 컬럼 또는 형식이 올바르지 않습니다. " +
            "필수 컬럼: id, post_id, nickname, content, status, created_at."
          );
        }
        if (record.post_id < 1 || record.post_id > state.loungePosts.length) continue;
        const comments = commentsByPost.get(record.post_id) || [];
        comments.push({
          id: record.id,
          author: record.nickname,
          text: record.content,
          isApproved: true,
          isFromDatabase: true
        });
        commentsByPost.set(record.post_id, comments);
      }
      if (requestId !== state.loungeCommentsRequestId) return;
      state.loungePosts.forEach((post, index) => {
        const fixedComments = post.comments.filter(comment => !comment.isFromDatabase);
        post.comments = [...fixedComments, ...(commentsByPost.get(index + 1) || [])];
      });
      state.loungeCommentsLoaded = true;
      state.loungeCommentsError = "";
    }

    }

      } finally {

      return `<nav class="main-nav" aria-label="메인 메뉴">
        <button type="button" data-main-view="match" aria-current="${active === "match" ? "page" : "false"}">Match♥</button>
        <button type="button" data-main-view="lounge" aria-current="${active === "lounge" ? "page" : "false"}">VIP Lounge</button>
      </nav>`;
    }

    function renderLounge() {
      app.innerHTML = `
        <section class="screen app-screen lounge-screen">
          ${renderNotification()}
          ${renderMainNav("lounge")}
          <header class="lounge-heading">
            <span class="eyebrow">PRIVATE COMMUNITY</span>
            <h2>VIP Lounge</h2>
            <p>이름 대신 취향으로 만나는 프라이빗 라운지</p>
          </header>
          ${state.loungeCommentsError && !state.loungeCommentsLoaded ? `
            <button class="comments-retry" type="button" data-retry-comments aria-label="댓글 불러오기 다시 시도">댓글 다시 불러오기</button>
          ` : ""}
          ${state.loungeCommentsError && state.loungeCommentsLoaded ? `
            <p class="comments-connection-status" role="alert">${escapeHtml(state.loungeCommentsError)}</p>
          ` : ""}
          <div class="community-feed">
            ${state.loungePosts.map((post, index) => `
              <article class="post-card">
                <div class="post-meta"><span class="post-author">@${escapeHtml(post.author)}</span><time>${escapeHtml(post.time)}</time></div>
                <h3>${escapeHtml(post.title)}</h3>
                <p class="post-body">${escapeHtml(post.body)}</p>
                <div class="post-actions">
                  <button class="like-button" type="button" data-like-post="${index}" aria-pressed="${post.isLiked}" aria-label="${escapeHtml(post.title)} ${post.isLiked ? "공감 취소" : "공감"}">
                    <span aria-hidden="true">${post.isLiked ? "♥" : "♡"}</span><span>${post.isLiked ? "공감 완료" : "공감"}</span><span>${post.likes}</span>
                  </button>
                  <button class="comments-toggle" type="button" data-toggle-comments="${index}" aria-expanded="${post.isCommentsOpen}" aria-controls="comments-${index}">
                    💬 댓글 ${post.isCommentsOpen ? "접기" : "보기"} (${post.comments.length})
                  </button>
                </div>
                <div class="comment-panel${post.isCommentsOpen ? " is-open" : ""}" id="comments-${index}" aria-hidden="${!post.isCommentsOpen}"${post.isCommentsOpen ? "" : " inert"}>
                  <div class="comment-panel-inner">
                    <section class="post-comments" aria-label="${escapeHtml(post.title)} 댓글">
                      <p class="comments-label">COMMENTS · ${post.comments.length}</p>
                      <div class="comment-list">
                        ${post.comments.map(comment => `
                          <div class="comment">
                            <span class="comment-author">@${escapeHtml(comment.author)}</span>
                            <span class="comment-text">${escapeHtml(comment.text)}</span>
                          </div>
                        `).join("")}
                      </div>
                      ${post.isCommentLocked ? `
                        <p class="comment-locked" role="note">이 게시글은 댓글 작성이 제한되었습니다.</p>
                        <form class="comment-form" data-comment-post="${index}" aria-label="댓글 작성 잠김">
                          <input name="nickname" type="text" maxlength="24" placeholder="댓글 잠금" aria-label="댓글 닉네임" disabled>
                          <input name="text" type="text" maxlength="280" placeholder="댓글 작성이 제한되었습니다" aria-label="댓글 내용" disabled>
                          <button type="submit" disabled>등록</button>
                        </form>
                      ` : `
                        <form class="comment-form" data-comment-post="${index}">
                          <input name="nickname" type="text" maxlength="24" placeholder="닉네임" aria-label="댓글 닉네임" required>
                          <input name="text" type="text" maxlength="280" placeholder="댓글을 남겨보세요" aria-label="댓글 내용" required>
                          <button type="submit">등록</button>
                        </form>
                      `}
                    </section>
                  </div>
                </div>
              </article>
            `).join("")}
          </div>
        </section>`;
    }

    function renderTabBar(active) {
      return `<nav class="tab-bar" aria-label="하단 메뉴">
        <button class="tab" type="button" data-action="tab-swipe" aria-current="${active === "swipe" ? "page" : "false"}"><span class="tab-icon" aria-hidden="true">⌕</span>탐색</button>
        <button class="tab" type="button" data-action="tab-messages" aria-current="${active === "messages" ? "page" : "false"}"><span class="tab-icon" aria-hidden="true">♡</span>메시지${state.matches.length ? ` · ${state.matches.length}` : ""}</button>
      </nav>`;
    }

    function renderMessages() {
      app.innerHTML = `
        <section class="screen app-screen message-screen">
          ${renderNotification()}
          ${renderMainNav("match")}
          <div class="message-heading"><h2>메시지</h2><p>마음이 통하는 인연과 대화를 시작해 보세요.</p></div>
          ${state.matches.length ? `
            <div class="match-list">
              ${state.matches.map((match, index) => `
                <button class="match-row" type="button" data-open-match="${index}">
                  <span class="match-avatar">${match.image ? `<img src="${match.image}" alt="">` : initials(match.name)}</span>
                  <span class="match-copy"><strong>${escapeHtml(match.name)}, ${match.age}</strong><span><span class="new-dot"></span>새로운 매칭 · 메시지를 확인해 보세요</span></span>
                  <span class="match-meta">방금</span>
                </button>`).join("")}
            </div>
          ` : `
            <div class="empty-state"><div><div class="seal" aria-hidden="true">♡</div><h2>아직 매칭된 인연이 없어요</h2><p>탐색에서 마음에 드는 프로필에 호감을 보내면 매칭 소식과 메시지를 이곳에서 확인할 수 있어요.</p></div></div>
          `}
          ${renderTabBar("messages")}
        </section>`;
      attachAppActions();
      document.querySelectorAll("[data-open-match]").forEach(button => {
        button.addEventListener("click", () => {
          state.activeMatch = state.matches[Number(button.dataset.openMatch)];
          state.screen = "chat";
          render();
        });
      });
    }

    function renderChat() {
      const match = state.activeMatch;
      if (!match) {
        state.screen = "messages";
        renderMessages();
        return;
      }
      app.innerHTML = `
        <section class="screen app-screen chat-screen">
          ${renderMainNav("match")}
          <header class="chat-header">
            <button class="back-button" type="button" data-action="back-messages" aria-label="메시지 목록으로">‹</button>
            <div class="chat-person"><span class="match-avatar">${match.image ? `<img src="${match.image}" alt="">` : initials(match.name)}</span><span><strong>${escapeHtml(match.name)}</strong><span>✦ Verified member</span></span></div>
          </header>
          <div class="chat-body" id="chat-body">
            <span class="chat-date">TODAY · JUST MATCHED</span>
            <div class="bubble-row"><span class="match-avatar">${match.image ? `<img src="${match.image}" alt="">` : initials(match.name)}</span><div class="bubble">${escapeHtml(match.greeting)}</div></div>
          </div>
          <form class="chat-composer" id="chat-form">
            <input name="message" type="text" maxlength="500" placeholder="메시지를 입력하세요" aria-label="메시지 입력" autocomplete="off">
            <button class="send-button" type="submit" aria-label="메시지 보내기">↑</button>
          </form>
        </section>`;
      document.querySelector('[data-action="back-messages"]').addEventListener("click", () => {
        state.screen = "messages";
        render();
      });
      document.querySelector("#chat-form").addEventListener("submit", event => {
        event.preventDefault();
        const input = event.currentTarget.elements.message;
        const text = input.value.trim();
        if (!text) return;
        const bubble = document.createElement("div");
        bubble.className = "bubble sent-bubble";
        bubble.textContent = text;
        document.querySelector("#chat-body").append(bubble);
        input.value = "";
      });
    }

    function attachAppActions() {
      document.querySelectorAll('[data-action="like"]').forEach(button => button.addEventListener("click", () => decide(true)));
      document.querySelectorAll('[data-action="pass"]').forEach(button => button.addEventListener("click", () => decide(false)));
      document.querySelectorAll('[data-action="tab-swipe"]').forEach(button => button.addEventListener("click", () => {
        state.screen = "swipe";
        render();
      }));
      document.querySelectorAll('[data-action="tab-messages"]').forEach(button => button.addEventListener("click", () => {
        state.screen = "messages";
        render();
      }));
      document.querySelectorAll('[data-action="dismiss-notice"]').forEach(button => button.addEventListener("click", () => {
        state.notice = null;
        render();
      }));
    }

    function decide(liked) {
      if (state.screen !== "swipe" || state.cardIndex >= maleProfiles.length) return;
      const profile = maleProfiles[state.cardIndex];
      if (liked) {
        window.setTimeout(() => {
          const match = { ...profile };
          state.matches.unshift(match);
          state.notice = match;
          if (state.screen !== "chat") render();
          window.setTimeout(() => {
            if (state.notice === match) {
              state.notice = null;
              if (state.screen !== "chat") render();
            }
          }, 5200);
        }, 5000);
      }
      state.cardIndex += 1;
      render();
    }

    function attachSwipeGestures() {
      const card = document.querySelector(".profile-card");
      if (!card) return;
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let dragging = false;
      card.addEventListener("pointerdown", event => {
        if (event.target.closest("button")) return;
        startX = event.clientX;
        startY = event.clientY;
        currentX = 0;
        dragging = true;
        card.setPointerCapture(event.pointerId);
      });
      card.addEventListener("pointermove", event => {
        if (!dragging) return;
        currentX = event.clientX - startX;
        const currentY = event.clientY - startY;
        if (Math.abs(currentX) > Math.abs(currentY)) {
          card.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${currentX / 18}deg)`;
          card.querySelector(".stamp-like").style.opacity = Math.max(0, Math.min(1, currentX / 90));
          card.querySelector(".stamp-pass").style.opacity = Math.max(0, Math.min(1, -currentX / 90));
        }
      });
      const endDrag = () => {
        if (!dragging) return;
        dragging = false;
        if (Math.abs(currentX) > 90) {
          card.style.transition = "transform .22s ease, opacity .22s ease";
          card.style.opacity = "0";
          card.style.transform = `translate(${currentX > 0 ? 520 : -520}px, 20px) rotate(${currentX > 0 ? 24 : -24}deg)`;
          window.setTimeout(() => decide(currentX > 0), 170);
        } else {
          card.style.transform = "";
          card.querySelector(".stamp-like").style.opacity = "0";
          card.querySelector(".stamp-pass").style.opacity = "0";
        }
      };
      card.addEventListener("pointerup", endDrag);
      card.addEventListener("pointercancel", endDrag);
    }

    function render() {
      if (state.screen === "landing") renderLanding();
      else if (state.screen === "profile") renderProfile();
      else if (state.screen === "loading") renderLoading();
      else if (state.screen === "swipe") renderSwipe();
      else if (state.screen === "messages") renderMessages();
      else if (state.screen === "chat") renderChat();
      else if (state.screen === "lounge") renderLounge();
    }

    app.addEventListener("click", event => {
      const target = event.target instanceof Element ? event.target : null;
      if (!target) return;
      const mainViewButton = target.closest("[data-main-view]");
      if (mainViewButton) {
        if (mainViewButton.dataset.mainView === "lounge") {
          if (state.screen !== "lounge") state.matchScreenBeforeLounge = state.screen;
          state.screen = "lounge";
        } else if (mainViewButton.dataset.mainView === "match") {
          state.screen = state.screen === "lounge" ? state.matchScreenBeforeLounge : "swipe";
        }
        render();
        if (state.screen === "lounge") void loadLoungeComments();
        return;
      }
      const retryCommentsButton = target.closest("[data-retry-comments]");
      if (retryCommentsButton) {
        void loadLoungeComments();
        return;
      }
      const likeButton = target.closest("[data-like-post]");
      if (likeButton) {
        const post = state.loungePosts[Number(likeButton.dataset.likePost)];
        if (!post) return;
        const scrollTop = document.querySelector(".lounge-screen")?.scrollTop ?? 0;
        post.isLiked = !post.isLiked;
        post.likes = Math.max(0, post.likes + (post.isLiked ? 1 : -1));
        renderLounge();
        document.querySelector(".lounge-screen").scrollTop = scrollTop;
        return;
      }
      const commentsToggle = target.closest("[data-toggle-comments]");
      if (commentsToggle) {
        const post = state.loungePosts[Number(commentsToggle.dataset.toggleComments)];
        if (!post) return;
        post.isCommentsOpen = !post.isCommentsOpen;
        commentsToggle.setAttribute("aria-expanded", String(post.isCommentsOpen));
        commentsToggle.textContent = `💬 댓글 ${post.isCommentsOpen ? "접기" : "보기"} (${post.comments.length})`;
        const panel = document.getElementById(commentsToggle.getAttribute("aria-controls"));
        if (panel) {
          panel.classList.toggle("is-open", post.isCommentsOpen);
          panel.setAttribute("aria-hidden", String(!post.isCommentsOpen));
          panel.toggleAttribute("inert", !post.isCommentsOpen);
        }
        return;
      }
      const action = target.closest('[data-action="begin"]');
      if (action) {
        state.screen = "profile";
        render();
      }
    });

    app.addEventListener("submit", event => {
      const form = event.target;
      if (!(form instanceof HTMLFormElement)) return;
      if (!form.matches("[data-comment-post]")) return;
      event.preventDefault();
      void submitLoungeComment(form);
    });

    function renderLoungePreservingScroll() {
      if (state.screen !== "lounge") return;
      const scrollTop = document.querySelector(".lounge-screen")?.scrollTop ?? 0;
      renderLounge();
      const loungeScreen = document.querySelector(".lounge-screen");
      if (loungeScreen) loungeScreen.scrollTop = scrollTop;
    }

    render();
  </script>
</body>
</html>
